name: freshness

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read verified version
        id: verified
        run: echo "version=$(tr -d '[:space:]' < evidence/VERIFIED_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Read latest Claude Code version
        id: latest
        run: echo "version=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"

      - name: Run deterministic suite
        run: node tests/run-tests.mjs

      - name: Prove the suite can fail
        run: node tests/run-tests.mjs --prove-fail

      - name: Verify evidence ledger
        run: node tools/verify-evidence.mjs

      - name: Documentation numbers match the artifacts
        run: node tools/coverage-report.mjs --doc-numbers

      - name: Validate-output checker self-test
        run: node tools/check-validate-output.mjs --self-test

      - name: Frozen docs revision is provable
        # Tier 3 replicate 1 was measured against 20 specific documentation pages.
        # On 2026-08-03 the mirror collector re-ran, wrote every page over the
        # canonical tree, and regenerated its own manifest over the old hashes,
        # destroying both the bytes and the record of them. Recovery was luck.
        # The self-test is the part CI can actually run: it builds a throwaway
        # revision, mutates one byte, and asserts the checker goes red, so this
        # gate has been observed failing. The live 20/20 comparison needs a mirror
        # and exits 2 (cannot check) on a runner that has none, which is why the
        # live check is not what the build depends on.
        run: node tools/docs-revision-check.mjs --self-test

      - name: Tier 3 key quality
        # Key defects used to be found by graders AFTER a run and filed as
        # prose. Now they are a gate. The frozen v1 set is expected RED (15
        # errors, which is the evidence this check would have caught the
        # instrument before the run); the live v2 set must be GREEN.
        run: |
          node tools/tier3-keys-lint.mjs --self-test
          node tools/tier3-keys-lint.mjs --defects
          node tools/tier3-keys-lint.mjs --set v2

      - name: Tier 3 harness self-tests
        # Each of these three feeds its own gate a known-bad input and passes
        # only if the gate rejects it: a planted key leak, an arm label left on
        # a blinded sheet, a grader returning one record short. A gate that has
        # never been shown failing is not evidence, and the S055 gap is what
        # that costs.
        run: |
          node tools/tier3-strip.mjs --self-test
          node tools/tier3-pack.mjs --self-test
          node tools/tier3-score.mjs --self-test

      - name: Extension-doctor self-test
        # Runs the doctor against the committed lint-bench fixtures: every
        # documented failure mode must be detected, the clean tree must yield
        # ZERO findings, and the three false-positive shapes the live
        # calibration run exposed (multi-line quoted scalar, zero-indent block
        # sequence, the "*" matcher wildcard) must stay green. Gutting any
        # check turns exactly its fixture row red.
        run: node tools/extension-doctor.mjs --self-test

      - name: Lint-bench runner self-test
        # Scoring logic incl. the boilerplate-immunity rule (a run-level
        # diagnostic must never fake a catch), plus fixture-generator drift.
        run: node tests/lint-bench/run-bench.mjs --self-test

      - name: Extension-prove self-test
        # Matcher semantics, exit-code and stdout-JSON verdict interpretation,
        # permission-rule evaluation incl. the documented "Write(path) is
        # accepted but never consulted" silent failure, and the boilerplate
        # immunity rule (printing BLOCKED with exit 0 is still an allow).
        run: node tools/extension-prove.mjs --self-test

      - name: Extension-prove is not hollow
        # Every enforce and wiring case re-run against an empty tree and an
        # inert always-exit-0 handler. A case that still passes is asserting
        # nothing about the extension; the run prints PROVER IS HOLLOW.
        run: node tools/extension-prove.mjs --prove-fail

      - name: Extension-scaffold self-test
        # Mechanism selection (guarantee + fail-closed must pick the deny rule,
        # because a command hook fails open), target extraction, and that an
        # out-of-family requirement is REFUSED rather than force-fitted.
        run: node tools/extension-scaffold.mjs --self-test

      - name: Prove-bench runner self-test
        # Scoring logic incl. false-positive-on-the-control weighted like a
        # miss and n/a for an uninstalled tool, plus fixture-generator drift.
        run: node tests/prove-bench/run-bench.mjs --self-test

      - name: Tier 3 artifacts match their sources
        # Drift gates, not self-tests. The committed batches must still derive
        # from the scenario set, the blinding map must still match the answers,
        # and the published percentages must still be what the raw grades say.
        # Prose drifting from the artifacts it describes is the defect this repo
        # has now been bitten by three times.
        run: |
          node tools/tier3-strip.mjs --check
          node tools/tier3-pack.mjs --check
          node tools/tier3-score.mjs --check
          # The v2 block is what the published tables actually are. No --mirror
          # here: the mirror is not committed (copyright), so the verified-quote
          # column is regenerated only when a mirror is present locally, and the
          # committed block carries the rates it was published with.
          node tools/tier3-score.mjs --set v2 --check

      - name: Validate plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          # Commit-SHA versioning is deliberate, so --strict would fail on the
          # "No version specified" advisory. The checker enforces, by set
          # subtraction, that the advisory is the ONLY warning; its ability to
          # fail is proven by the self-test step above. No continue-on-error:
          # this is a release gate, and it already caught a real frontmatter
          # defect the moment it was armed.
          claude plugin validate . 2>&1 | tee /tmp/validate-out.txt
          node tools/check-validate-output.mjs /tmp/validate-out.txt

      - name: Compare versions and write status
        id: status
        run: |
          V="${{ steps.verified.outputs.version }}"
          L="${{ steps.latest.outputs.version }}"
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$V" = "$L" ]; then
            STATE=verified
            COLOR=brightgreen
            MSG="verified against $V"
          else
            STATE=stale
            COLOR=orange
            MSG="$L released after last verification ($V)"
          fi
          printf '{"schemaVersion":1,"label":"claude code","message":"%s","color":"%s","state":"%s","verified":"%s","latest":"%s","checked":"%s"}\n' \
            "$MSG" "$COLOR" "$STATE" "$V" "$L" "$TODAY" > evidence/status.json
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "latest=$L" >> "$GITHUB_OUTPUT"

      - name: Commit status.json when changed
        run: |
          if ! git diff --quiet evidence/status.json; then
            git config user.name "freshness-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add evidence/status.json
            git commit -m "chore: freshness status ${{ steps.status.outputs.state }} (latest ${{ steps.status.outputs.latest }})"
            git push
          fi

      - name: Open verification issue when stale
        if: steps.status.outputs.state == 'stale'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          L="${{ steps.status.outputs.latest }}"
          TITLE="Claude Code $L verification required"
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Issue already open"; exit 0
          fi
          ENTRY=$(curl -fsSL https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md \
            | awk -v v="## $L" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f{print}')
          gh issue create --title "$TITLE" --body "$(printf 'Claude Code %s has been released and is newer than the verified build in evidence/VERIFIED_VERSION.\n\nChangelog entry:\n\n%s\n\nRe-verify affected reference claims, bump the headers, update VERIFIED_VERSION, and close this issue.\n\nOpened automatically by the freshness workflow.' "$L" "$ENTRY")"
