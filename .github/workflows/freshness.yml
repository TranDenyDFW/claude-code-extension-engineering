name: freshness

# Split into five jobs on 2026-08-05, from one 20-step monolith.
#
# Three reasons, in order of how much they cost before the split. A single
# failing step used to hide every later gate, so a run reported the FIRST defect
# and never the set. The whole run needed `contents: write` because its LAST job
# pushes a status file, so twenty steps that only read the tree carried a token
# that could rewrite it. And the gates are independent, so they were serialising
# for no reason.
#
# Only `freshness` writes. Everything else is read-only with
# persist-credentials: false, which removes the checkout token from the runner's
# git config entirely rather than trusting the steps not to use it.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, "feat/**"]
  # Added 2026-08-05. Before this, `push: branches: [main]` meant NONE of the
  # gates below had ever fired on a feature branch outside workflow_dispatch, so
  # every check in this file was unproven on the branch that introduced it.
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- suite ----
  suite:
    name: deterministic suite and evidence ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run deterministic suite
        run: node tests/run-tests.mjs

      - name: Prove the suite can fail
        run: node tests/run-tests.mjs --prove-fail

      - name: Verify evidence ledger
        run: node tools/verify-evidence.mjs

      - name: Documentation numbers match the artifacts
        run: node tools/coverage-report.mjs --doc-numbers

      - name: Validate-output checker self-test
        run: node tools/check-validate-output.mjs --self-test

      - name: Frozen docs revision is provable
        # Tier 3 replicate 1 was measured against 20 specific documentation pages.
        # On 2026-08-03 the mirror collector re-ran, wrote every page over the
        # canonical tree, and regenerated its own manifest over the old hashes,
        # destroying both the bytes and the record of them. Recovery was luck.
        # The self-test is the part CI can actually run: it builds a throwaway
        # revision, mutates one byte, and asserts the checker goes red, so this
        # gate has been observed failing. The live 20/20 comparison needs a mirror
        # and exits 2 (cannot check) on a runner that has none, which is why the
        # live check is not what the build depends on.
        run: node tools/docs-revision-check.mjs --self-test

  # ---------------------------------------------------------------- tools ----
  tools:
    name: doctor, prover, scaffold and benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extension-doctor self-test
        # Runs the doctor against the committed lint-bench fixtures: every
        # documented failure mode must be detected, the clean tree must yield
        # ZERO findings, and the three false-positive shapes the live
        # calibration run exposed (multi-line quoted scalar, zero-indent block
        # sequence, the "*" matcher wildcard) must stay green. Gutting any
        # check turns exactly its fixture row red.
        run: node tools/extension-doctor.mjs --self-test

      - name: Lint-bench runner self-test
        # Scoring logic incl. the boilerplate-immunity rule (a run-level
        # diagnostic must never fake a catch), plus fixture-generator drift.
        run: node tests/lint-bench/run-bench.mjs --self-test

      - name: Extension-prove self-test
        # Matcher semantics, exit-code and stdout-JSON verdict interpretation,
        # permission-rule evaluation incl. the documented "Write(path) is
        # accepted but never consulted" silent failure, the mechanism adapters
        # (a skill bundle is REFUSED with exit 3, not scored red against hooks.md
        # citations), and the boilerplate immunity rule.
        run: node tools/extension-prove.mjs --self-test

      - name: Extension-prove is not hollow
        # Every enforce and wiring case re-run against an empty tree and an
        # inert always-exit-0 handler. A case that still passes is asserting
        # nothing about the extension; the run prints PROVER IS HOLLOW.
        run: node tools/extension-prove.mjs --prove-fail

      - name: Bash-recognition table matches its measurement
        # The deny rule's Bash coverage is documented BY EXAMPLE and never
        # enumerated, so it cannot be read out of the docs and is measured
        # instead. --self-test pins the classifier AND the row that matters most:
        # with an empty table every shape is UNDETERMINED, never allowed, so an
        # uncalibrated shape reddens a case rather than silently reporting a
        # bypass nobody observed. --check is the drift gate between the frozen
        # table and the recorded paired measurement; it exits 2 (cannot check)
        # when no measurement is present, which is the safe state and is why the
        # build does not rest on it alone.
        run: |
          node tools/bash-recognition.mjs --self-test
          node tools/bash-recognition-run.mjs --self-test
          node tools/bash-recognition.mjs --check || [ $? -eq 2 ]
          # List-only: the probes spawn live Claude Code sessions, never in CI.
          node tools/bash-recognition-probes.mjs > /dev/null

      - name: Extension-scaffold end-to-end gate
        # The gate that was missing. --self-test exercises analyse() and
        # conformanceFor() as functions and never GENERATES a bundle and PROVES
        # it, which is how four defects shipped at once behind a green build:
        # hook bundles failing their own spec since 63a3ecc, a sentence-final
        # period becoming the glob infra/./** which matches nothing, the
        # permission-deny bundle shipping the hook its README called rejected,
        # and advisory bundles emitting enforce cases against an empty
        # settings.json. --gate asserts a frozen case-kind map and file list per
        # probe, so a pass count cannot hide any of them.
        run: |
          set -euo pipefail
          node tools/extension-scaffold.mjs --gate
          node tools/extension-scaffold.mjs --gate --prove-gate-can-fail

      - name: Extension-scaffold self-test
        # Mechanism selection (a guarantee must pick the deny rule, because a
        # command hook fails open), target extraction, and that an out-of-family
        # requirement is REFUSED rather than force-fitted.
        run: node tools/extension-scaffold.mjs --self-test

      - name: Pack registry, policy schema and validate-before-action self-tests
        # Routing that refuses rather than defaulting, the policy validator's
        # refusals (which are most of its behaviour), and the emitted runtime.
        run: |
          node tools/packs/index.mjs --self-test
          node tools/packs/policy-schema.mjs --self-test
          node tools/packs/validate-before-action.mjs --self-test

      - name: Scaffold end-to-end gate
        # Generates all 13 frozen probes across both packs and PROVES each one,
        # including running the hollowness detector against what it just
        # generated. Nothing in CI did that until 2026-08-07, and an independent
        # review then found 27 case-runs whose PASS did not depend on the
        # extension at all.
        run: node tools/extension-scaffold.mjs --gate

      - name: Scaffold parity
        # The seven protect-path probes must stay byte-identical to the goldens
        # captured before the pack refactor.
        run: node tools/scaffold-parity.mjs --check

      - name: One broken handler per validation family
        # The gate injections corrupt the generator; this corrupts the SHIPPED
        # handler and requires a NAMED case to go red for each family.
        run: node tests/validation-family-breaks.mjs

      - name: Validation cohort fixture drift
        # Committed fixtures must match the generator, and all twelve must still
        # share one conformance.json: the spec is the constant, the
        # implementation is the single variable.
        run: |
          node tests/prove-bench/validation/make-fixtures.mjs --self-test
          node tests/prove-bench/validation/make-fixtures.mjs --check
          node tests/prove-bench/validation/run-bench.mjs --self-test

      - name: Validation cohort record still reproduces
        # RE-MEASURES the published 10 of 10 and fails on any change to the prove
        # column. Nothing did this until 2026-08-07: report() returns zero unless
        # the control is dirty, so a regression that turned every row into a MISS
        # exited 0 and a re-run would have overwritten the record with it. The
        # competitor column is compared only where test-hook.sh is installed.
        run: node tests/prove-bench/validation/run-bench.mjs --verify-record

      - name: Prove-bench runner self-test
        # Scoring logic incl. false-positive-on-the-control weighted like a
        # miss and n/a for an uninstalled tool, plus fixture-generator drift.
        run: node tests/prove-bench/run-bench.mjs --self-test

  # ---------------------------------------------------------------- tier3 ----
  tier3:
    name: tier 3 instrument and artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verbatim quotes still exist upstream
        # "Re-verify against the new build" used to be a manual sweep over 163
        # version tags. This makes the narrowest part of it mechanical: a claim
        # that quotes upstream verbatim is falsified the moment that sentence
        # stops existing. --self-test pins the extractor AND its must-fail case;
        # the live comparison needs the docs mirror, which is not committed
        # (copyright), so it exits 2 (cannot check) on a runner and the build does
        # not rest on it. It found two real defects on its first run, both OURS:
        # a paraphrase and an uppercased word, each presented inside quotation
        # marks as if verbatim.
        run: |
          node tools/quote-check.mjs --self-test
          node tools/quote-check.mjs || [ $? -eq 2 ]
      - name: Tier 3 key quality
        # Key defects used to be found by graders AFTER a run and filed as
        # prose. Now they are a gate. The frozen v1 set is expected RED (15
        # errors, which is the evidence this check would have caught the
        # instrument before the run); the live v2 set must be GREEN.
        run: |
          node tools/tier3-keys-lint.mjs --self-test
          node tools/tier3-keys-lint.mjs --defects
          node tools/tier3-keys-lint.mjs --set v2

      - name: Tier 3 harness self-tests
        # Each of these three feeds its own gate a known-bad input and passes
        # only if the gate rejects it: a planted key leak, an arm label left on
        # a blinded sheet, a grader returning one record short. A gate that has
        # never been shown failing is not evidence, and the S055 gap is what
        # that costs.
        run: |
          node tools/tier3-strip.mjs --self-test
          node tools/tier3-pack.mjs --self-test
          node tools/tier3-score.mjs --self-test

      - name: Tier 3 artifacts match their sources
        # Drift gates, not self-tests. The committed batches must still derive
        # from the scenario set, the blinding map must still match the answers,
        # and the published percentages must still be what the raw grades say.
        # Prose drifting from the artifacts it describes is the defect this repo
        # has now been bitten by three times.
        run: |
          node tools/tier3-strip.mjs --check
          node tools/tier3-pack.mjs --check
          node tools/tier3-score.mjs --check
          # The v2 block is what the published tables actually are. No --mirror
          # here: the mirror is not committed (copyright), so the verified-quote
          # column is regenerated only when a mirror is present locally, and the
          # committed block carries the rates it was published with.
          node tools/tier3-score.mjs --set v2 --check
          # The merged grade file is DERIVED, not authored. It used to be neither:
          # it carried 3369 records while its twelve inputs carried 3360, and the 9
          # adjudication records existed nowhere else. A published result resting on
          # a file that cannot be re-derived is a result taken on trust, and it
          # would have become permanent the moment a repaired key was re-graded
          # into it by hand.
          node tools/tier3-grades.mjs --self-test
          node tools/tier3-grades.mjs --set v2 --check
          # Each replicate must pass the strict completeness gate on its OWN before
          # it may be pooled, and the published pooled block must re-derive from the
          # raw grades of all three. The pooled path refuses a partial replicate and
          # refuses a differing grading-batch partition, because leave-one-batch-out
          # is undefined when a batch means different scenarios in different passes.
          node tools/tier3-grades.mjs --set v2 --rep 2 --check
          node tools/tier3-grades.mjs --set v2 --rep 3 --check
          node tools/tier3-score.mjs --set v2 --rep 2 --check
          node tools/tier3-score.mjs --set v2 --rep 3 --check
          node tools/tier3-score.mjs --set v2 --replicates 1,2,3 --check

  # ------------------------------------------------------------- manifest ----
  manifest:
    name: plugin manifest validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          # Commit-SHA versioning is deliberate, so --strict would fail on the
          # "No version specified" advisory. The checker enforces, by set
          # subtraction, that the advisory is the ONLY warning; its ability to
          # fail is proven by its own self-test in the suite job. No
          # continue-on-error: this is a release gate, and it already caught a
          # real frontmatter defect the moment it was armed.
          claude plugin validate . 2>&1 | tee validate-out.txt
          node tools/check-validate-output.mjs validate-out.txt

  # ------------------------------------------------------------ freshness ----
  # The ONLY job that writes. It runs after the gates so a stale-version issue is
  # never opened against a tree that does not pass its own checks, and it is
  # skipped on pull_request, where the checkout is a merge ref and pushing to it
  # is meaningless.
  freshness:
    name: version freshness and status badge
    runs-on: ubuntu-latest
    needs: [suite, tools, tier3, manifest]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      issues: write
    steps:
      # persist-credentials stays DEFAULT here, deliberately: this job pushes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Read verified version
        id: verified
        run: echo "version=$(tr -d '[:space:]' < evidence/VERIFIED_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Read latest Claude Code version
        id: latest
        run: echo "version=$(npm view @anthropic-ai/claude-code version)" >> "$GITHUB_OUTPUT"

      - name: Compare versions and write status
        id: status
        run: |
          V="${{ steps.verified.outputs.version }}"
          L="${{ steps.latest.outputs.version }}"
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$V" = "$L" ]; then
            STATE=verified
            COLOR=brightgreen
            MSG="verified against $V"
          else
            STATE=stale
            COLOR=orange
            MSG="$L released after last verification ($V)"
          fi
          printf '{"schemaVersion":1,"label":"claude code","message":"%s","color":"%s","state":"%s","verified":"%s","latest":"%s","checked":"%s"}\n' \
            "$MSG" "$COLOR" "$STATE" "$V" "$L" "$TODAY" > evidence/status.json
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "latest=$L" >> "$GITHUB_OUTPUT"

      - name: Commit status.json when changed
        # Only on main. On a feature branch this would push a bot commit into
        # someone's open work, which is a surprise nobody asked for.
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet evidence/status.json; then
            git config user.name "freshness-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add evidence/status.json
            git commit -m "chore: freshness status ${{ steps.status.outputs.state }} (latest ${{ steps.status.outputs.latest }})"
            git push
          fi

      - name: Open verification issue when stale
        if: steps.status.outputs.state == 'stale' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          L="${{ steps.status.outputs.latest }}"
          TITLE="Claude Code $L verification required"
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Issue already open"; exit 0
          fi
          ENTRY=$(curl -fsSL https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md \
            | awk -v v="## $L" 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f{print}')
          gh issue create --title "$TITLE" --body "$(printf 'Claude Code %s has been released and is newer than the verified build in evidence/VERIFIED_VERSION.\n\nChangelog entry:\n\n%s\n\nRe-verify affected reference claims, bump the headers, update VERIFIED_VERSION, and close this issue.\n\nOpened automatically by the freshness workflow.' "$L" "$ENTRY")"
